<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dff0ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Belajar Seru</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Trebuchet MS",Verdana,sans-serif;background:#dff0ff;color:#1b2a49;-webkit-user-select:none;user-select:none}
#app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:60px}
.back{border:0;border-radius:20px;background:#fff;font-size:22px;font-weight:700;padding:12px 20px;box-shadow:0 4px 0 #b9cde6;color:#1b2a49;font-family:inherit}
.score{font-size:28px;font-weight:700}
.q{text-align:center;font-size:clamp(26px,5.5vw,44px);font-weight:700;margin:8px 0}
.show{text-align:center;font-size:clamp(50px,12vw,110px);line-height:1.2;min-height:100px;word-break:break-all}
.big{font-size:clamp(90px,22vw,200px);font-weight:700;color:#e63946;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:auto;padding-bottom:8px}
.opt{flex:1 1 180px;min-height:120px;border:0;border-radius:28px;font-size:clamp(40px,9vw,80px);font-weight:700;font-family:inherit;background:#fff;color:#1b2a49;box-shadow:0 7px 0 #b9cde6}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 #b9cde6}
.menu{display:flex;flex-wrap:wrap;gap:16px;flex:1;align-content:center;justify-content:center}
.menu .opt{flex:1 1 280px;min-height:120px;font-size:clamp(28px,6vw,44px);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sndt{text-align:center;font-size:20px;margin-top:8px;min-height:28px;font-weight:700}
.ex{font-size:.6em;color:#1b2a49;font-weight:400}
.salah{animation:g .3s}
@keyframes g{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.ok{text-align:center;font-size:clamp(30px,7vw,56px);font-weight:700;color:#1f8a43;min-height:64px}
h1{text-align:center;font-size:clamp(34px,8vw,60px);margin:6px 0}
.alb{text-align:center;font-size:36px;min-height:50px}
.slots{display:flex;justify-content:center;gap:10px;margin:6px 0}
.slot{width:clamp(48px,13vw,90px);height:clamp(60px,16vw,110px);border-radius:18px;background:#fff;border:4px dashed #8fb3de;font-size:clamp(34px,9vw,64px);font-weight:700;text-align:center;line-height:clamp(52px,14vw,102px);color:#1d6fdc}
.tile{flex:0 1 auto;min-width:clamp(60px,16vw,110px);min-height:clamp(70px,18vw,120px);font-size:clamp(36px,9vw,64px);padding:0 10px}
.tile.used{visibility:hidden}
.grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;flex:1;align-content:center}
.card{flex:1 1 22%;min-height:clamp(90px,22vw,150px);border:0;border-radius:22px;font-size:clamp(40px,10vw,76px);background:#1d6fdc;color:#fff;box-shadow:0 6px 0 #14509e;font-family:inherit}
.card.open{background:#fff;color:#000;box-shadow:0 6px 0 #b9cde6}
.card.done{background:#c6f0d3;color:#000;box-shadow:none}
.stick{position:sticky;top:0;background:#dff0ff;text-align:center;padding:2px 0 8px;z-index:2}
.stick .big{font-size:clamp(60px,15vw,120px)}
.grid2{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:24px}
.ch{flex:1 1 72px;min-height:82px;font-size:clamp(28px,7vw,50px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.cs{display:inline-block;width:1.1em;height:1.1em;border-radius:16%;border:.06em solid #1b2a49;vertical-align:middle}
.hw{display:flex;align-items:center;gap:8px;flex:1;min-height:0}
.hl{width:clamp(70px,18vw,170px);text-align:center;font-weight:700;color:#e63946;font-size:clamp(80px,22vw,190px);line-height:1;-webkit-user-select:none}
.hw canvas{flex:1;min-width:0;width:auto;min-height:260px;height:55vh;max-height:480px}
.hb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 0 10px}
canvas{width:100%;flex:1;min-height:72vh;background:#fff;border-radius:24px;touch-action:none;box-shadow:0 6px 0 #b9cde6}
.pal{display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap;justify-content:center}
.pal button{width:54px;height:54px;border-radius:50%;border:5px solid #fff;box-shadow:0 3px 0 #b9cde6}

/* GAME YUZARSHIF SI JENIUS */
#gmC{flex:none;width:100%;height:auto;min-height:0;aspect-ratio:2/1;background:#cfeee0;border-radius:20px;border:3px solid #2fa37a;box-shadow:none;display:block;touch-action:none}
#gmPad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;touch-action:none}
#gmPad .g{display:flex;gap:10px}
.gb{font-family:inherit;font-size:34px;font-weight:700;color:#23403a;background:#fff3c4;border:4px solid #f2b632;border-radius:24px;width:96px;height:84px;touch-action:none}
.gb.on{transform:scale(.94);filter:brightness(.9)}
#gmJ{width:150px;background:#ff8a3d;border-color:#e86a14;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KATA=[["Apel","🍎"],["Bola","⚽"],["Cicak","🦎"],["Domba","🐑"],["Es krim","🍦"],["Gajah","🐘"],["Ikan","🐟"],["Kucing","🐱"],["Lebah","🐝"],["Mobil","🚗"],["Nanas","🍍"],["Pisang","🍌"],["Sapi","🐮"],["Topi","🎩"],["Ular","🐍"]];
var EJA=[["BOLA","⚽"],["TOPI","🎩"],["IKAN","🐟"],["APEL","🍎"],["SAPI","🐮"],["BEBEK","🦆"],["GAJAH","🐘"],["MOBIL","🚗"],["NANAS","🍍"],["KUCING","🐱"],["PISANG","🍌"],["KATAK","🐸"]];
var STK=["🚀","🦄","🌈","🐳","🎈","🍭","🦖","🎨","🏆","🦋"];
var app=document.getElementById("app"),mode="",lock=false,ctx,S={stars:0,stk:[]};
try{var sv=JSON.parse(localStorage.getItem("bs2")||"null");if(sv)S=sv}catch(e){}
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem("bs2",JSON.stringify(S))}catch(e){}}
function lvl(){return Math.min(2,Math.floor(S.stars/8))}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function tone(f,d){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
var NS=false;
function pickV(u){try{var v=speechSynthesis.getVoices();for(var i=0;i<v.length;i++){if(/^id/i.test(v[i].lang)){u.voice=v[i];break}}}catch(e){}}
function say(t,cb){var d=false,t0=Date.now();
  function fin(bad){if(d)return;d=true;var el=Date.now()-t0;if(bad||el<350)NS=true;
    if(cb){var w=NS?Math.max(0,2500-el):0;setTimeout(cb,w)}}
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){NS=true;if(cb)setTimeout(cb,2500);return}
  try{var u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.5;pickV(u);
    u.onend=function(){fin(false)};u.onerror=function(){fin(true)};
    speechSynthesis.cancel();speechSynthesis.speak(u);
    if(cb)setTimeout(function(){fin(false)},12000)}
  catch(e){NS=true;if(cb)setTimeout(cb,2500)}}
function tesSuara(){var r=$("snd");r.innerHTML="Mencoba suara...";NS=false;
  say("Halo Yuzarshif, ayo belajar",function(){
    r.innerHTML=NS?"🔇 Suara bicara tidak ada di tablet ini. Tidak apa-apa, belajar tetap bisa lewat tulisan.":"🔊 Kalau terdengar, suara berfungsi. Kalau tidak, naikkan volume media."})}
function head(){return '<div class="top"><button class="back" onclick="menu()">Menu</button><div class="score" id="sc">⭐ '+S.stars+'</div></div>'}
function good(extra){
  lock=true;S.stars++;var m="Yuzarshif pintar!";
  if(S.stars%5==0){var s=STK[S.stk.length%STK.length];S.stk.push(s);m="Yuzarshif pintar! Dapat stiker "+s}
  save();tone(880,.25);var o=$("ok");if(o){o.style.color="";o.innerHTML=m+(extra?"<br><span class=\"ex\">"+extra+"</span>":"")}$("sc").innerHTML="⭐ "+S.stars;
  say(m.replace(/[^\w\s!,]/g,"")+" "+(extra||""),function(){setTimeout(go,700)});
}
function salah(){tone(220,.3);var o=$("ok");if(o){o.style.color="#d62828";o.innerHTML="Ayo coba lagi 😊";setTimeout(function(){if(o&&o.innerHTML.indexOf("coba")>=0){o.innerHTML="";o.style.color=""}},1500)}say("Salah Yuzarshif, ayo coba lagi")}
function bad(id){salah();var b=$(id);if(b){var c=b.className;b.className=c+" salah";setTimeout(function(){b.className=c},350)}}
function menu(){
  mode="";lock=true;eView="cat";eTok++;sgTok++;lgStopA();try{vsStop()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  if(window.Game)Game.stop();
  app.innerHTML='<h1>Belajar Seru</h1><div class="alb">'+S.stk.join(" ")+'</div><div class="menu">'+
   '<button class="opt" style="background:#d6336c" onclick="start(\'abc\')">🔠 Kenal Huruf A-Z</button>'+
   '<button class="opt" style="background:#0f9d8a" onclick="start(\'num\')">🔢 Kenal Angka 0-100</button>'+
   '<button class="opt" style="background:#e63946" onclick="start(\'huruf\')">🔤 Huruf</button>'+
   '<button class="opt" style="background:#f77f00" onclick="start(\'tambah\')">➕ Tambah</button>'+
   '<button class="opt" style="background:#2a9d4b" onclick="start(\'susun\')">🧩 Susun Kata</button>'+
   '<button class="opt" style="background:#7b2cbf" onclick="start(\'memori\')">🃏 Cari Pasangan</button>'+
   '<button class="opt" style="background:#1d6fdc" onclick="start(\'gambar\')">🎨 Menggambar</button>'+
   '<button class="opt" style="background:#0b7285" onclick="start(\'inggris\')">🇬🇧 Kosakata Inggris</button>'+
   '<button class="opt" style="background:#c2255c" onclick="start(\'lagu\')">🎵 Lagu Anak</button>'+
   '<button class="opt" style="background:#e8590c" onclick="start(\'game\')">🎮 Game Yuzarshif si Jenius</button></div><div style="text-align:center;padding:10px 0"><button class="back" onclick="tesSuara()">🔊 Tes Suara</button><div class="sndt" id="snd"></div></div>';
}
function start(m){mode=m;go()}
function go(){lock=false;({abc:abc,num:num,huruf:huruf,tambah:tambah,susun:susun,memori:memori,gambar:gambar,game:game,inggris:inggris,lagu:laguMenu})[mode]()}

/* KENAL HURUF & ANGKA */
var PL=["#e63946","#f77f00","#2a9d4b","#1d6fdc","#7b2cbf","#d6336c"];
function abc(){
  var h="";
  for(var i=0;i<26;i++){var L=String.fromCharCode(65+i);h+='<button class="opt ch" style="background:'+PL[i%6]+'" onclick="pk(\''+L+'\')">'+L+'</button>'}
  app.innerHTML=head()+'<div class="stick"><span class="big" id="bg">A a</span></div><div class="grid2">'+h+'</div>';
  say("Sentuh huruf");
}
function pk(L){tone(600,.1);$("bg").innerHTML=L+" "+L.toLowerCase();say("Yuzarshif, ini huruf, "+L)}
function num(){
  var h="";
  for(var i=0;i<=100;i++)h+='<button class="opt ch" style="background:'+PL[Math.floor(i/10)%6]+'" onclick="nm('+i+')">'+i+'</button>';
  app.innerHTML=head()+'<div class="stick"><span class="big" id="bg">0</span></div><div class="grid2">'+h+'</div>';
  say("Sentuh angka");
}
function nm(n){tone(600,.1);$("bg").innerHTML=n;say("Yuzarshif, ini angka, "+n)}

/* 1. HURUF: menulis berurutan A-Z, a-z, 1-25 */
var HS=[],hI=0,hg,hcv;
(function(){var i;for(i=0;i<26;i++)HS.push(["upper",String.fromCharCode(65+i)]);
  for(i=0;i<26;i++)HS.push(["lower",String.fromCharCode(97+i)]);
  for(i=1;i<=25;i++)HS.push(["num",""+i])})();
try{hI=parseInt(localStorage.getItem("bs2h")||"0")||0}catch(e){}
if(hI<0||hI>=HS.length)hI=0;
function hLabel(it){return it[0]=="upper"?"huruf besar "+it[1]:it[0]=="lower"?"huruf kecil "+it[1]:"angka "+it[1]}
function hSave(){try{localStorage.setItem("bs2h",String(hI))}catch(e){}}
function hSay(pre){var it=HS[hI],l=[];if(pre&&pre.trim())l.push([pre.trim(),"id-ID",.6]);l.push(["Yuzarshif, ini","id-ID",.6]);l.push([it[0]=="upper"?"huruf besar":it[0]=="lower"?"huruf kecil":"angka","id-ID",.6]);l.push([it[1],"id-ID",.5]);sq(l)}
function hGuide(){var w=hcv.width,h=hcv.height;hg.clearRect(0,0,w,h);hg.save();hg.strokeStyle="#c9d8ee";hg.lineWidth=3;hg.setLineDash([12,10]);
  [0.25,0.5,0.75].forEach(function(r){hg.beginPath();hg.moveTo(10,h*r);hg.lineTo(w-10,h*r);hg.stroke()});hg.restore()}
function hClr(){hGuide()}
function huruf(){
  var it=HS[hI],L=it[1],t=it[0]=="upper"?"Tulis huruf besar":it[0]=="lower"?"Tulis huruf kecil":"Tulis angka";
  app.innerHTML=head()+'<div class="q">'+t+' <span style="color:#1d6fdc">'+(hI+1)+'/'+HS.length+'</span></div>'+
   '<div class="hw"><div class="hl" onclick="hSay()">'+L+'</div><canvas id="hc"></canvas><div class="hl" onclick="hSay()">'+L+'</div></div>'+
   '<div class="ok" id="ok" style="min-height:44px;font-size:clamp(20px,4vw,30px)"></div>'+
   '<div class="hb"><button class="back" onclick="hPrev()">⬅ Kembali</button><button class="back" onclick="hClr()">🗑 Hapus</button><button class="back" onclick="hSay()">🔊 Dengar</button>'+
   '<button class="back" style="background:#2a9d4b;color:#fff;box-shadow:0 4px 0 #1b6e33" onclick="hNext()">Lanjut ➡</button></div>';
  hcv=$("hc");hcv.width=hcv.clientWidth;hcv.height=hcv.clientHeight;hg=hcv.getContext("2d");hGuide();
  var dr=false,lx,ly,g=hg;
  function xy(e){var r=hcv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*hcv.width/r.width,(p.clientY-r.top)*hcv.height/r.height]}
  function dn(e){e.preventDefault();dr=true;var q=xy(e);lx=q[0];ly=q[1];g.fillStyle="#1d6fdc";g.beginPath();g.arc(lx,ly,6,0,7);g.fill()}
  function mv(e){if(!dr)return;e.preventDefault();var q=xy(e);g.strokeStyle="#1d6fdc";g.lineWidth=12;g.lineCap="round";g.lineJoin="round";g.setLineDash([]);g.beginPath();g.moveTo(lx,ly);g.lineTo(q[0],q[1]);g.stroke();lx=q[0];ly=q[1]}
  function up(){dr=false}
  hcv.addEventListener("touchstart",dn,false);hcv.addEventListener("touchmove",mv,false);hcv.addEventListener("touchend",up,false);hcv.addEventListener("touchcancel",up,false);
  hcv.addEventListener("mousedown",dn,false);hcv.addEventListener("mousemove",mv,false);hcv.addEventListener("mouseup",up,false);hcv.addEventListener("mouseleave",up,false);
  hSay();
}
function hPrev(){if(hI>0){hI--;hSave();huruf()}}
function hNext(){
  tone(880,.2);S.stars++;var m="Yuzarshif pintar!";
  if(S.stars%5==0){var st=STK[S.stk.length%STK.length];S.stk.push(st);m="Yuzarshif pintar! Dapat stiker "+st}
  save();var fin=(hI+1>=HS.length);
  if(fin){hI=0;m="Hebat! Semua selesai. Kita ulang dari awal."}else hI++;
  hSave();huruf();
  var o=$("ok");if(o)o.innerHTML=m;$("sc").innerHTML="⭐ "+S.stars;
  hSay(m.replace(/[^\w\s!,.]/g,"")+" ")}

/* 2. TAMBAH */
function tambah(){
  var mx=[5,8,10][lvl()],a=1+rnd(mx-1),b=1+rnd(mx-a),s=a+b,p=[],i,x="🍎",A="",B="";
  for(i=1;i<=mx;i++)if(i!=s)p.push(i);
  var ch=shuffle([s].concat(shuffle(p).slice(0,2))),c=ch.indexOf(s),o="";
  for(i=0;i<a;i++)A+=x;for(i=0;i<b;i++)B+="🍌";
  for(i=0;i<3;i++)o+='<button class="opt" id="o'+i+'" onclick="tj('+i+','+c+','+s+','+a+','+b+')">'+ch[i]+'</button>';
  app.innerHTML=head()+'<div class="q">'+a+' tambah '+b+' sama dengan berapa?</div><div class="show" style="font-size:clamp(36px,8vw,70px)">'+A+'<br>➕<br>'+B+'</div><div class="ok" id="ok"></div><div class="row">'+o+'</div>';
  say(a+" tambah "+b+" sama dengan berapa, Yuzarshif?");
}
function tj(i,c,s,a,b){if(lock)return;if(i==c)good(a+" tambah "+b+" sama dengan "+s);else bad("o"+i)}

/* 3. SUSUN KATA */
var W,pos,tl;
function susun(){
  var mxl=[4,5,6][lvl()],pool=EJA.filter(function(e){return e[0].length<=mxl});
  W=pool[rnd(pool.length)];pos=0;tl=shuffle(W[0].split(""));
  var s="",t="",i;
  for(i=0;i<W[0].length;i++)s+='<div class="slot" id="s'+i+'"></div>';
  for(i=0;i<tl.length;i++)t+='<button class="opt tile" id="t'+i+'" onclick="sj('+i+')">'+tl[i]+'</button>';
  app.innerHTML=head()+'<div class="q">Susun hurufnya!</div><div class="show">'+W[1]+'</div><div class="slots">'+s+'</div><div class="ok" id="ok"></div><div class="row" style="justify-content:center">'+t+'</div>';
  say("Susun hurufnya!");
}
function sj(i){
  if(lock)return;
  if(tl[i]==W[0].charAt(pos)){
    $("s"+pos).innerHTML=tl[i];$("t"+i).className="opt tile used";pos++;tone(660,.12);
    if(pos==W[0].length)good(W[0].split("").join(" ")+", "+W[0].toLowerCase());
  }else bad("t"+i);
}

/* 4. CARI PASANGAN */
var cd,op,dn;
function memori(){
  var n=3+lvl(),e=shuffle(KATA).slice(0,n),i;cd=[];
  for(i=0;i<n;i++){cd.push(e[i][1]);cd.push(e[i][1])}
  cd=shuffle(cd);op=[];keep=[];
  app.innerHTML=head()+'<div class="q">Cari kartu yang sama!</div><div class="ok" id="ok"></div><div class="grid" id="gr"></div>';
  mdraw2();say("Cari kartu yang sama!");
}
function mdraw(){
  var h="";
  for(var i=0;i<cd.length;i++){
    var st=cd[i]===null?"card done":(op.indexOf(i)>=0?"card open":"card");
    h+='<button class="'+st+'" onclick="mj('+i+')">'+(st=="card"?"❓":(cd[i]||"✔"))+'</button>';
  }
  $("gr").innerHTML=h;
}
var keep=[];
function mj(i){
  if(lock||op.indexOf(i)>=0||keep.indexOf(i)>=0)return;
  op.push(i);tone(500,.08);mdraw2();
  if(op.length==2){
    lock=true;var a=op[0],b=op[1];
    if(cd[a]==cd[b]){
      setTimeout(function(){keep.push(a,b);op=[];tone(780,.2);lock=false;mdraw2();},500);
    }else setTimeout(function(){op=[];lock=false;mdraw2();salah()},1000);
  }
}
function mdraw2(){
  var h="";
  for(var i=0;i<cd.length;i++){
    var k=keep.indexOf(i)>=0,o=op.indexOf(i)>=0,st=k?"card done":(o?"card open":"card");
    h+='<button class="'+st+'" onclick="mj('+i+')">'+(k||o?cd[i]:"❓")+'</button>';
  }
  $("gr").innerHTML=h;
  if(keep.length==cd.length){keep=[];good("Semua kartu cocok")}
}

/* 5. MENGGAMBAR */
function gambar(){
  var C=["#e63946","#f77f00","#f7c500","#2a9d4b","#1d6fdc","#7b2cbf","#6b3e26","#000000"],p="";
  for(var i=0;i<C.length;i++)p+='<button style="background:'+C[i]+'" onclick="col=\''+C[i]+'\'"></button>';
  p+='<button style="background:#fff;font-size:26px" onclick="clr()">🗑</button>';
  app.innerHTML=head()+'<canvas id="cv"></canvas><div class="pal">'+p+'</div>';
  var cv=$("cv");cv.width=cv.clientWidth;cv.height=cv.clientHeight;
  var g=cv.getContext("2d"),dr=false,lx,ly;
  g.lineWidth=7;g.lineCap="round";g.lineJoin="round";
  function xy(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}

function ttl(n){return n.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ")}

  try{var c=d.transaction("f","readonly").objectStore("f").openCursor();
    c.onsuccess=function(){var cu=c.result;if(cu){if(cu.value.kind==kind)out.push(cu.value);cu.continue()}else cb(out)};
    c.onerror=function(){cb(out)}}catch(e){cb(out)}})}
function dbAdd(kind,f,cb){dbOpen(function(d){if(!d)return cb(false);
  try{var tx=d.transaction("f","readwrite");tx.objectStore("f").add({kind:kind,name:f.name,size:f.size,blob:f});
    tx.oncomplete=function(){cb(true)};tx.onerror=function(){cb(false)};tx.onabort=function(){cb(false)}}catch(e){cb(false)}})}

  try{var tx=d.transaction("f","readwrite");tx.objectStore("f").delete(id);tx.oncomplete=function(){cb()};tx.onerror=function(){cb()};tx.onabort=function(){cb()}}catch(e){cb()}
  try{if(fUrl[id]){URL.revokeObjectURL(fUrl[id]);delete fUrl[id]}}catch(e){}})}

  var u=fUrl[r.id]||(fUrl[r.id]=URL.createObjectURL(r.blob));return{t:ttl(r.name),src:u,id:r.id,n:r.name,z:r.size}}))})}
